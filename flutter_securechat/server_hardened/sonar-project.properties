sonar.projectKey=securechat-server-hardened
sonar.projectName=SecureChat Hardened Server
sonar.projectVersion=1.0

# Kaynak ve test dizinleri (iki modul)
sonar.sources=signaling-server/src/main/kotlin,bot-api/src/main/kotlin
sonar.tests=signaling-server/src/test/kotlin,bot-api/src/test/kotlin

# Kotlin analiz derlenmis siniflardan yararlanir
sonar.java.binaries=signaling-server/build/classes/kotlin/main,bot-api/build/classes/kotlin/main
sonar.java.test.binaries=signaling-server/build/classes/kotlin/test,bot-api/build/classes/kotlin/test

# Coverage: jacoco XML (zaten uretiliyor)
sonar.coverage.jacoco.xmlReportPaths=signaling-server/build/reports/jacoco/test/jacocoTestReport.xml,bot-api/build/reports/jacoco/test/jacocoTestReport.xml

sonar.sourceEncoding=UTF-8
