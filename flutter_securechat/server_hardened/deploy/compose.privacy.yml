name: securechat-hardened

x-runtime-hardening: &runtime-hardening
  read_only: true
  init: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  ulimits:
    core:
      soft: 0
      hard: 0
  pids_limit: 256
  # JVM `MaxRAMPercentage` container limiti yoksa host RAM'ine gore
  # hesaplar; limitsiz calisan bir process OOM'da host'u da etkiler.
  mem_limit: ${SERVICE_MEMORY_LIMIT:-1g}
  cpus: ${SERVICE_CPU_LIMIT:-1.0}
  restart: unless-stopped
  logging:
    driver: none
  networks: [securechat-internal]

services:
  redis-ephemeral:
    <<: *runtime-hardening
    image: ${REDIS_IMAGE:?Set an immutable redis image@sha256 digest}
    user: "999:999"
    # Container limiti Redis'in kendi `maxmemory` degerinden buyuk olmalidir.
    # Kucuk olursa Redis kendi sinirina varmadan cekirdek tarafindan
    # oldurulur; `noeviction` ile amaclanan "yazmayi reddet, veri kaybetme"
    # davranisi da bu durumda hic devreye girmez. Fragmentasyon ve kopya
    # tamponlari icin maxmemory'nin yaklasik 1.5 kati birakilir.
    mem_limit: ${REDIS_MEMORY_LIMIT:-3g}
    command:
      - /bin/sh
      - -euc
      - |
        umask 077
        password="$$(cat /run/secrets/redis_password)"
        test -n "$$password"
        printf 'user default on >%s ~* +@all\n' "$$password" > /tmp/users.acl
        unset password
        exec redis-server --aclfile /tmp/users.acl --appendonly no --save '' --maxmemory ${REDIS_MAXMEMORY:-2gb} --maxmemory-policy noeviction
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=8m,mode=0700,uid=999,gid=999
      - /data:rw,nosuid,nodev,size=8m,mode=0700,uid=999,gid=999
    secrets: [redis_password]

  signaling:
    <<: *runtime-hardening
    # Redis yalniz ic agdadir. Signaling ayrica kontrollu egress
    # agina baglanir; disari cikan tek bagimlilik kumesi budur:
    # PostgreSQL, SMTP ve Firebase (FCM/APNs).
    # Host firewall bu hedeflerin disina cikisi allow-list ile reddetmelidir.
    networks: [securechat-internal, securechat-egress]
    image: ${SIGNALING_IMAGE:?Set the hardened signaling image@sha256 digest}
    user: "10001:10001"
    depends_on: [redis-ephemeral]
    ports:
      - "${SIGNALING_BIND_IP:-127.0.0.1}:${SIGNALING_BIND_PORT:-8080}:8080"
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=0700,uid=10001,gid=10001
    environment:
      PRIVACY_PRODUCTION_MODE: "true"
      HOST: 0.0.0.0
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:?Set the PostgreSQL JDBC URL}
      DATABASE_USER: ${DATABASE_USER:-securechat}
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      REDIS_HOST: redis-ephemeral
      REDIS_PORT: "6379"
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      TURN_HOST: ${TURN_HOST:?Set the TURN host}
      TURN_PORT: ${TURN_PORT:-3478}
      # Relay TLS zorunludur: duz turn: uzerinde username ve relay adresi
      # yol uzerindeki gozlemciye aciktir (bkz. ProductionDeploymentPolicy).
      # Bos birakilirsa TURN_HOST kullanilir.
      TURN_TLS_HOST: ${TURN_TLS_HOST:-}
      TURN_TLS_PORT: ${TURN_TLS_PORT:-5349}
      TURN_SECRET_FILE: /run/secrets/turn_secret
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      PRIVACY_INDEX_KEY_FILE: /run/secrets/privacy_index_key
      OFFLINE_QUEUE_ENCRYPTION_KEY_FILE: /run/secrets/offline_queue_key
      FCM_TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/fcm_token_key
      METRICS_BEARER_TOKEN_FILE: /run/secrets/metrics_token
      SMTP_HOST: ${SMTP_HOST:?Set the TLS SMTP host}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set the SMTP username}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      SMTP_FROM: ${SMTP_FROM:?Set the OTP sender address}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase_service_account
      DIRECTORY_OPRF_KEY_BACKEND: PKCS11
      DIRECTORY_OPRF_PKCS11_PROVIDER: ${DIRECTORY_OPRF_PKCS11_PROVIDER:?Set the configured PKCS11 provider}
      DIRECTORY_OPRF_KEY_ALIAS: ${DIRECTORY_OPRF_KEY_ALIAS:?Set the non-exportable RSA key alias}
      DIRECTORY_OPRF_KEYSTORE_PIN_FILE: /run/secrets/directory_hsm_pin
      JAVA_TOOL_OPTIONS: ${SIGNALING_JAVA_OPTS:--XX:MaxRAMPercentage=70}
      # Reverse proxy arkasinda gercek istemci adresi yalniz bu listedeki
      # kaynaklardan gelen `X-Forwarded-For` ile belirlenir. Bos birakilirsa
      # header hic okunmaz ve limitler proxy adresine uygulanir.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?Set the reverse proxy address or CIDR}
      ALLOW_LEGACY_PLAINTEXT_QUEUE: "false"
      # Bloklayan PostgreSQL/Redis isinin calistigi havuz. Varsayilan
      # cekirdek*8'dir; baglanti havuzlarindan cok daha buyuk bir deger
      # yalniz bekleme kuyrugunu thread'lere tasir.
      BLOCKING_IO_THREADS: ${BLOCKING_IO_THREADS:-}
    secrets:
      - database_password
      - redis_password
      - turn_secret
      - jwt_secret
      - privacy_index_key
      - offline_queue_key
      - fcm_token_key
      - metrics_token
      - smtp_password
      - firebase_service_account
      - directory_hsm_pin


networks:
  # Servisler arasi trafik; disari cikisi yoktur.
  securechat-internal:
    internal: true
  # Yalniz dis bagimliliklara erisim icin. Redis bu aga bilerek baglanmaz:
  # kisa TTL'li ciphertext tutan process'in disari cikan bir yolu olmamalidir.
  securechat-egress:
    internal: false

secrets:
  database_password:
    file: "${DATABASE_PASSWORD_FILE:?Set a read-only secret file}"
  redis_password:
    file: "${REDIS_PASSWORD_FILE:?Set a read-only secret file}"
  turn_secret:
    file: "${TURN_SECRET_FILE:?Set a read-only secret file}"
  jwt_secret:
    file: "${JWT_SECRET_FILE:?Set a read-only secret file}"
  privacy_index_key:
    file: "${PRIVACY_INDEX_KEY_FILE:?Set a read-only secret file}"
  offline_queue_key:
    file: "${OFFLINE_QUEUE_KEY_FILE:?Set a read-only secret file}"
  fcm_token_key:
    file: "${FCM_TOKEN_KEY_FILE:?Set a read-only secret file}"
  metrics_token:
    file: "${METRICS_TOKEN_FILE:?Set a read-only secret file}"
  smtp_password:
    file: "${SMTP_PASSWORD_FILE:?Set a read-only secret file}"
  firebase_service_account:
    file: "${FIREBASE_SERVICE_ACCOUNT_FILE:?Set the Firebase JSON secret file}"
  directory_hsm_pin:
    file: "${DIRECTORY_HSM_PIN_FILE:?Set the HSM PIN secret file}"
