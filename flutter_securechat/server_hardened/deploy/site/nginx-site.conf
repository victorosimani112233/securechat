# Elcim halka acik site vhost'u — gizlilik politikasi, kullanim sartlari ve
# hesap silme sayfalari. Mağaza listelemelerinin isaret ettigi adres budur.
#
# NEDEN AYRI VHOST: `185.22.184.114` uzerindeki API vhost'unun sertifikasi
# istemci binary'sine SPKI parmak iziyle PINLIDIR. O vhost'a dokunmak ya da
# sertifikasini Let's Encrypt ile degistirmek, sahadaki her kurulumun
# baglantisini koparir. Bu dosya yalnizca YENI iki server blogu ekler; mevcut
# `sites-available/securechat` dosyasina hic dokunulmaz.
#
# Kurulum:
#   /etc/nginx/sites-available/elcim-site  olarak kaydet
#   ln -s /etc/nginx/sites-available/elcim-site /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

# ---------------------------------------------------------------------------
# Port 80 — ACME dogrulamasi ve HTTPS yonlendirmesi
#
# SIRA ONEMLI: `location /.well-known/acme-challenge/` yonlendirmeden ONCE
# gelir. Aksi halde certbot'un HTTP-01 dogrulamasi 301 yiyip basarisiz olur.
# Mevcut yapilandirmada 80 portundaki tek blok IP icin kosuluyor ve her seyi
# HTTPS'e atiyordu; alan adi icin gelen challenge istegi de ona dusuyordu.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name tereaiqos.online www.tereaiqos.online;

    # Ziyaretci IP'si kisisel veridir; projenin geri kalaniyla tutarli olarak
    # diske yazilmaz.
    access_log off;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Port 443 — statik site
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tereaiqos.online www.tereaiqos.online;

    # certbot bu iki satiri kendi yoluyla degistirecek; ilk kurulumda
    # certbot --nginx bunlari yazar.
    ssl_certificate     /etc/letsencrypt/live/tereaiqos.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tereaiqos.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ElcimSiteTLS:10m;
    ssl_session_tickets off;

    access_log off;
    error_log  /var/log/nginx/elcim-site_error.log crit;
    server_tokens off;

    root /var/www/elcim;
    index index.html;

    # Alan adi oldugu icin HSTS burada ANLAMLI. IP tabanli vhost'ta
    # tarayicilar HSTS'i yok sayar (RFC 6797 §8.1.1), o yuzden orada yok.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    # Sayfalar tamamen self-contained: harici font, script veya analytics yok.
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # Uzantisiz adresler: /privacy -> privacy.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        default_type text/plain;
    }

    gzip on;
    gzip_types text/html text/css;
    gzip_min_length 512;
}
