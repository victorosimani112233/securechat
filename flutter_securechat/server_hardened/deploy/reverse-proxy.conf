# Hardened reverse proxy reference configuration (nginx).
#
# Bu dosya deploy hedefinin parcasidir. Container `logging: none` ile
# calissa bile host proxy'si kendi access logunu tutar; oradaki bir kayit
# gizlilik sozlesmesinin disina cikar. Ayrica WebSocket upgrade isteginde
# `Authorization` header'i proxy tarafindan iletilmezse istemci hicbir
# zaman baglanamaz.
#
# Dogrulanmasi gereken uc davranis:
#   1. access log kapali (veya kimlik tasimayan ozel formatta),
#   2. upgrade isteginde Authorization header'i korunuyor,
#   3. `token=` query parametresi tasiyan istekler proxy seviyesinde
#      reddediliyor — sunucu da reddeder, fakat o noktaya gelmeden once
#      token proxy loguna girmis olurdu.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    server_name ${SECURECHAT_PUBLIC_HOST};

    ssl_certificate     /etc/ssl/securechat/fullchain.pem;
    ssl_certificate_key /etc/ssl/securechat/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 1) Kimlik tasiyan hicbir alan diske yazilmaz.
    access_log off;
    error_log  /dev/null crit;

    # Govde siniri: uygulama katmani da sinirlar, bu ilk savunmadir.
    client_max_body_size 256k;
    client_body_buffer_size 64k;

    # 3) Query string'de credential tasima girisimi reddedilir.
    if ($arg_token) {
        return 400;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 2) Bearer credential yalniz burada tasinir; iletilmezse baglanti kurulmaz.
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        # Uygulama rate limitleri gercek istemciyi gormek zorundadir; bu
        # header yalniz guvenilen proxy'den kabul edilmelidir (bkz. P1-05).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Operasyonel yuzeyler public degildir.
    location /metrics { return 404; }
    location /admin   { return 404; }
}
