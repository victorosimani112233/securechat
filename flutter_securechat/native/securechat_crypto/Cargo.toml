[package]
name = "securechat_crypto"
version = "0.1.0"
edition = "2021"
publish = false
description = "Elcim icin dar C ABI: vodozemac (Apache-2.0) Olm/Megolm yuzeyi"
license = "Apache-2.0"

[lib]
name = "securechat_crypto"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
vodozemac = "0.9"
base64 = "0.22"
serde_json = "1"
zeroize = "1"

[profile.release]
# Kripto cekirdegi: panic'te unwind yerine abort. Bir panic'in FFI sinirini
# gecmesi tanimsiz davranis; abort daha guvenli bir basarisizlik.
panic = "abort"
opt-level = 3
lto = true
strip = true
