global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Backend uygulama metrikleri
  - job_name: 'securechat-backend'
    static_configs:
      - targets: ['backend:8080']
    metrics_path: /metrics
    scrape_interval: 10s

  # PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Node (sistem)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Prometheus kendi metrikleri
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
