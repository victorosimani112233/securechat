# SecureChat PostgreSQL 16 — 8GB RAM, 4 core icin optimize
listen_addresses = '*'
port = 5432

# Bellek
shared_buffers = 2GB
effective_cache_size = 4GB
work_mem = 16MB
maintenance_work_mem = 256MB

# Baglanti
max_connections = 200

# WAL
wal_buffers = 64MB
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 256MB

# Planlayici
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Loglama
log_min_duration_statement = 500
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

# Locale
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
