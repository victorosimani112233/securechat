version: "3.9"

# Production-grade compose dosyasi.
# Tum servislerde:
#   - mem_limit + mem_reservation (OOM kill onlemi)
#   - logging.options (disk doldurma onlemi)
#   - stop_grace_period (graceful shutdown)
#
# Toplam yaklasik RAM: 4-5 GB (8GB sunucu icin uygun)

# Default logging policy — tum servislere uygulanir (override edilebilir)
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # --- PostgreSQL 16 ---
  postgres:
    image: postgres:16-alpine
    container_name: securechat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: securechat
      POSTGRES_USER: securechat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securechat -d securechat"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    mem_reservation: 128m
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - internal

  # --- Redis 7 ---
  redis:
    image: redis:7-alpine
    container_name: securechat-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 640m
    mem_reservation: 64m
    stop_grace_period: 15s
    logging: *default-logging
    networks:
      - internal

  # --- Nginx Reverse Proxy ---
  nginx:
    image: nginx:alpine
    container_name: securechat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/securechat.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_started
    mem_limit: 128m
    stop_grace_period: 10s
    logging: *default-logging
    networks:
      - internal
      - external

  # --- SecureChat Backend (Ktor) ---
  backend:
    build:
      context: ../signaling-server
      dockerfile: ../infra/Dockerfile.backend
    container_name: securechat-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      DATABASE_URL: jdbc:postgresql://postgres:5432/securechat
      DATABASE_USER: securechat
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TURN_SECRET: ${TURN_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      # SMTP (kendi mail server'in)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      ENV: ${ENV:-production}
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/firebase-service-account.json
      JANUS_WS_URL: ws://janus:8188
      JANUS_API_SECRET: ${JANUS_API_SECRET:-securechat_janus_api}
      JANUS_ADMIN_SECRET: janusoverlord
      # Production logging — INFO seviyesinde (DEBUG cok gurultulu)
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /app/logs
      # Graceful shutdown drain suresi
      SHUTDOWN_DRAIN_SECONDS: "30"
      # JVM container support — heap'i container limitine gore ayarlar
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75 -XX:InitialRAMPercentage=25"
    ports:
      - "9090:8080"
    volumes:
      - /root/firebase-service-account.json:/app/firebase-service-account.json:ro
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--tries=1", "--timeout=3", "http://localhost:8080/health", "||", "exit", "1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 2g
    mem_reservation: 512m
    stop_grace_period: 45s
    logging: *default-logging
    networks:
      - internal
    # Host'a expose ETME — Nginx uzerinden erisim

  # --- Janus Gateway (SFU) ---
  janus:
    image: canyan/janus-gateway:latest
    container_name: securechat-janus
    restart: unless-stopped
    volumes:
      - ./janus/janus.jcfg:/usr/local/etc/janus/janus.jcfg:ro
      - ./janus/janus.plugin.videoroom.jcfg:/usr/local/etc/janus/janus.plugin.videoroom.jcfg:ro
      - ./janus/janus.transport.websockets.jcfg:/usr/local/etc/janus/janus.transport.websockets.jcfg:ro
      - ./janus/janus.transport.http.jcfg:/usr/local/etc/janus/janus.transport.http.jcfg:ro
    ports:
      - "8188:8188"   # Janus WebSocket API
      - "8088:8088"   # Janus HTTP API
      - "20000-20200:20000-20200/udp"  # RTP media ports (janus.jcfg ile eslesir)
    environment:
      JANUS_API_SECRET: ${JANUS_API_SECRET:-securechat_janus_api}
    mem_limit: 512m
    mem_reservation: 64m
    stop_grace_period: 15s
    logging: *default-logging
    networks:
      - internal
      - external

volumes:
  postgres_data:
  redis_data:
  backend_logs:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
