version: "3.9"

# Production-grade compose dosyasi.
# Tum servislerde:
#   - mem_limit + mem_reservation (OOM kill onlemi)
#   - logging.options (disk doldurma onlemi)
#   - stop_grace_period (graceful shutdown)
#
# Toplam yaklasik RAM: 4-5 GB (8GB sunucu icin uygun)

# Default logging policy — tum servislere uygulanir (override edilebilir)
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # --- PostgreSQL 16 ---
  postgres:
    image: postgres:16-alpine
    container_name: securechat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: securechat
      POSTGRES_USER: securechat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securechat -d securechat"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    mem_reservation: 128m
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - internal

  # --- Redis 7 ---
  redis:
    image: redis:7-alpine
    container_name: securechat-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 640m
    mem_reservation: 64m
    stop_grace_period: 15s
    logging: *default-logging
    networks:
      - internal

  # --- Nginx Reverse Proxy ---
  nginx:
    image: nginx:alpine
    container_name: securechat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/securechat.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_started
    mem_limit: 128m
    stop_grace_period: 10s
    logging: *default-logging
    networks:
      - internal
      - external

  # --- SecureChat Backend (Ktor) ---
  backend:
    build:
      context: ../signaling-server
      dockerfile: ../infra/Dockerfile.backend
    container_name: securechat-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      DATABASE_URL: jdbc:postgresql://postgres:5432/securechat
      DATABASE_USER: securechat
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TURN_SECRET: ${TURN_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      # SMTP (kendi mail server'in)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      ENV: ${ENV:-production}
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/firebase-service-account.json
      JANUS_WS_URL: ws://janus:8188
      # GUVENLIK (H6 fix): default value yok — env yoksa startup'ta crash.
      JANUS_API_SECRET: ${JANUS_API_SECRET:?JANUS_API_SECRET env zorunlu (openssl rand -base64 32)}
      JANUS_ADMIN_SECRET: ${JANUS_ADMIN_SECRET:?JANUS_ADMIN_SECRET env zorunlu (openssl rand -base64 32)}
      # Janus public WS URL — Nginx reverse proxy uzerinden (wss:// + JWT auth).
      JANUS_PUBLIC_WS_URL: ${JANUS_PUBLIC_WS_URL:?JANUS_PUBLIC_WS_URL env zorunlu (wss://signal.../janus)}
      # GUVENLIK (H7 fix): FCM token AES-256-GCM encryption key — 32 byte base64.
      FCM_TOKEN_ENCRYPTION_KEY: ${FCM_TOKEN_ENCRYPTION_KEY:?FCM_TOKEN_ENCRYPTION_KEY env zorunlu (openssl rand -base64 32)}
      # Production logging — INFO seviyesinde (DEBUG cok gurultulu)
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /app/logs
      # Graceful shutdown drain suresi
      SHUTDOWN_DRAIN_SECONDS: "30"
      # JVM container support — heap'i container limitine gore ayarlar
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75 -XX:InitialRAMPercentage=25"
    ports:
      - "9090:8080"
    volumes:
      - /root/firebase-service-account.json:/app/firebase-service-account.json:ro
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --tries=1 --timeout=3 http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 2g
    mem_reservation: 512m
    stop_grace_period: 45s
    logging: *default-logging
    networks:
      - internal
    # Host'a expose ETME — Nginx uzerinden erisim

  # --- Janus Gateway (SFU) ---
  # GUVENLIK (C3 fix): 8188 ve 8088 admin/control portlari ARTIK HOSTA EXPOSE EDILMIYOR.
  # Sadece internal Docker network'unden backend service'i erisebilir. Client'lar Janus'a
  # Nginx reverse proxy uzerinden (wss://signal.../janus) baglanir; Nginx JWT validation yapar.
  # UDP RTP portlari (20000-20200) WebRTC medya icin disa acik kalmali (P2P traversal).
  janus:
    image: canyan/janus-gateway:latest
    container_name: securechat-janus
    restart: unless-stopped
    volumes:
      - ./janus/janus.jcfg:/usr/local/etc/janus/janus.jcfg:ro
      - ./janus/janus.plugin.videoroom.jcfg:/usr/local/etc/janus/janus.plugin.videoroom.jcfg:ro
      - ./janus/janus.transport.websockets.jcfg:/usr/local/etc/janus/janus.transport.websockets.jcfg:ro
      - ./janus/janus.transport.http.jcfg:/usr/local/etc/janus/janus.transport.http.jcfg:ro
    # 8188 ve 8088 expose ile internal-only (backend container erisebilir, host degil).
    expose:
      - "8188"   # Janus WebSocket API — internal-only
      - "8088"   # Janus HTTP API — internal-only (admin enumeration onlenir)
    ports:
      - "20000-20200:20000-20200/udp"  # RTP media ports — disa acik (WebRTC NAT traversal)
    environment:
      # GUVENLIK: env yoksa JanusOrchestrator startup'ta crash eder (H6 fix).
      # Default value yok — production'da .env'den 32+ char random secret zorunlu.
      JANUS_API_SECRET: ${JANUS_API_SECRET:?JANUS_API_SECRET env zorunlu}
      JANUS_ADMIN_SECRET: ${JANUS_ADMIN_SECRET:?JANUS_ADMIN_SECRET env zorunlu}
    mem_limit: 512m
    mem_reservation: 64m
    stop_grace_period: 15s
    logging: *default-logging
    networks:
      - internal
      # NOT: external network'ten KALDIRILDI — Janus artik dis aga dogrudan baglanmiyor.
      # RTP medya icin UDP portlari hala host network namespace'inden erisilebilir.

  # --- Bot API (send-only, Ed25519 imzali, signaling-server'dan ayri container) ---
  # GUVENLIK: read-only fs, cap_drop ALL, no-new-privileges, sadece internal network.
  # Nginx UZERINDEN ERISILMEZ — sadece host'a bind-mounted Unix socket'lerle erisilir.
  # Halen TCP localhost'ta dinliyor (Unix socket entegrasyonu sonraki adim).
  bot-api:
    build:
      context: ../bot-api
      dockerfile: ../infra/Dockerfile.bot-api
    container_name: securechat-bot-api
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/securechat
      DATABASE_USER: securechat
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # JWT_SECRET signaling-server ile paylasilir (Plan Karar #1 Option A).
      # v2'de internal HMAC endpoint'e gecilebilir.
      JWT_SECRET: ${JWT_SECRET}
      # 32 byte base64 — bot identity private key'i AES-256-GCM ile sarar.
      BOT_MASTER_KEY: ${BOT_MASTER_KEY:?BOT_MASTER_KEY env zorunlu (openssl rand -base64 32). KAYBOLURSA tum bot oturumlari geri donulemez sekilde kaybolur — escrow zorunlu.}
      # Admin endpoint'lere erisim icin token (X-Admin-Token header).
      BOT_ADMIN_TOKEN: ${BOT_ADMIN_TOKEN:?BOT_ADMIN_TOKEN env zorunlu (32+ char random).}
      SIGNALING_INTERNAL_URL: http://backend:8080
      SIGNALING_WS_URL: ws://backend:8080/ws
      # TCP listenerlar — Unix socket henuz Task 13 minimum kapsamda
      BOT_HEALTH_PORT: "8090"
      LOG_LEVEL: ${BOT_LOG_LEVEL:-INFO}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=50"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--tries=1", "--timeout=3", "http://localhost:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    mem_reservation: 128m
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - internal           # SADECE internal — external'da YOK
    # --- Hardening ---
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/bot:size=8m,mode=0770,uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    # NOT: ports yok — public endpoint disa kapali. Admin CLI host'tan
    # docker exec ile veya ileride Unix socket bind-mount ile erisir.

volumes:
  postgres_data:
  redis_data:
  backend_logs:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
