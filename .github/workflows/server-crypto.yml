name: Server Crypto Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'flutter_securechat/server_hardened/**'
      - 'flutter_securechat/lib/src/auth/**'
      - 'flutter_securechat/lib/src/backup/**'
      - 'flutter_securechat/lib/src/contacts/**'
      - 'flutter_securechat/lib/src/crypto/**'
      - 'flutter_securechat/lib/src/media/**'
      - 'flutter_securechat/test/**'
      - '.github/workflows/server-crypto.yml'
  push:
    branches: [main]
    paths:
      - 'flutter_securechat/server_hardened/**'
      - 'flutter_securechat/lib/src/auth/**'
      - 'flutter_securechat/lib/src/backup/**'
      - 'flutter_securechat/lib/src/contacts/**'
      - 'flutter_securechat/lib/src/crypto/**'
      - 'flutter_securechat/lib/src/media/**'
      - 'flutter_securechat/test/**'
      - '.github/workflows/server-crypto.yml'

permissions:
  contents: read

jobs:
  server-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter_securechat/server_hardened

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify pinned crypto vectors
        working-directory: flutter_securechat/server_hardened/tools/crypto-audit
        run: sha256sum -c SHA256SUMS

      - name: Compile, test, and run static Gradle checks
        run: |
          chmod +x gradlew
          ./gradlew test check --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-crypto-reports-${{ github.sha }}
          path: |
            flutter_securechat/server_hardened/signaling-server/build/reports/**
            flutter_securechat/server_hardened/signaling-server/build/test-results/**
            flutter_securechat/server_hardened/bot-api/build/reports/**
            flutter_securechat/server_hardened/bot-api/build/test-results/**
          if-no-files-found: warn
          retention-days: 14
